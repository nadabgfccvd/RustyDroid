# RustyDroid — data/jetpack.toml
# Apêndice D da spec: AndroidX/Jetpack (shims por módulo).
#
# Fonte executável consumida por rd-framework::fd_jetpack, `rd jetpack`,
# classificação MCP e `cargo xtask jetpack-report|jetpack-spec`.
#
# Semântica de status (conservadora, igual à do Apêndice C):
# - supported: modelo host com estado para o subconjunto documentado; NUNCA
#   a biblioteca inteira.
# - partial: subconjunto real executa (DEX sobre a plataforma host e/ou
#   shim host com estado); o resto é gap explícito.
# - stub: reconhecimento apenas (hierarquia/constantes/inflate/alocação).
# - not_implemented: nenhum modelo; falha tipada, nunca sucesso fingido.
#
# strategy: dex-passthrough (DEX da lib executa na VM) | host-shim (host
# intercepta métodos listados; resto cai no DEX) | host-native (só host).
# Presença de uma biblioteca no DEX de um APK NÃO é cobertura de execução.
schema_version = 1
source = "RustyDroid.md Appendix D"
api_floor = 26
api_ceiling = 36

[[category]]
id = "foundation"
name = "Foundation"
summary = "Base AndroidX: appcompat, core, activity, anotações, multidex e inicialização."

[[category]]
id = "architecture"
name = "Architecture"
summary = "Lifecycle, dados e navegação: room, paging, work, navigation, datastore, collection, palette."

[[category]]
id = "ui"
name = "UI"
summary = "Widgets e containers AndroidX/Material sobre o host de View, mais Compose (UI-05)."

[[category]]
id = "behavior"
name = "Behavior"
summary = "Mídia, câmera, biometria, cripto, credenciais e photo picker."

[[category]]
id = "di-async"
name = "DI/async"
summary = "Injeção de dependências e concorrência: hilt/dagger, coroutines/flow, RxJava."

[[category]]
id = "third-party"
name = "3rd-party comuns"
summary = "Bibliotecas comuns de terceiros (rede, JSON, imagens). Firebase vive no Apêndice E (data/gms.toml)."

