name: ✨ Feature request
description: Propose a new module, tool or capability / Proponha um módulo, ferramenta ou capacidade
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve / Problema a resolver
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / Solução proposta
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area / Área
      options:
        - CORE (apk/dex/vm)
        - Framework APIs (android.*)
        - UI / render
        - Agent tools (MCP)
        - Testing / QA
        - Performance
        - Docs / site
        - Other
    validations:
      required: true
  - type: checkboxes
    id: spec
    attributes:
      label: Relation to the spec / Relação com a spec
      description: The master spec defines ~85 modules — is this one of them?
      options:
        - label: This exists in RustyDroid.md (module ID informed below)
        - label: This is new (not in the spec)
