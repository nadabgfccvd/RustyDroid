name: 🔌 Compat gap (API not implemented)
description: Report an Android API/behavior that an APK needs and RustyDroid doesn't cover yet / API Android que o RustyDroid ainda não cobre
labels: ["compat-gap", "triage"]
body:
  - type: input
    id: api
    attributes:
      label: API / class / method
      placeholder: "android.hardware.camera2.CameraDevice#createCaptureSession"
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Spec module (if known) / Módulo da spec (se souber)
      options:
        - unknown / desconhecido
        - CORE-* (apk/dex/vm)
        - LANG-01 (Java/Kotlin DEX)
        - LANG-02/03/09 (native .so / NDK / others)
        - LANG-04..08 (Flutter/RN/C#/Unity)
        - UI-* (views/render)
        - ST-* (storage/data)
        - NET-* (network)
        - MEDIA-* (audio/video/camera/sensors)
        - SYS-* (system services)
        - AG-* (agent tools)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior on real Android / Comportamento esperado no Android real
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What RustyDroid returned / O que o RustyDroid respondeu
      placeholder: 'NOT_IMPLEMENTED(module_id="…", api="…")'
  - type: input
    id: apk
    attributes:
      label: APK that triggered it (name + version, optional) / APK que acionou (opcional)
  - type: textarea
    id: logs
    attributes:
      label: Logs / structured error JSON (optional)
