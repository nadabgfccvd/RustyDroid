name: Bench (regression gate)

# RustyDroid.md §3.2: "bench.yml | push main | criterion + github-action-benchmark
# (fail em regressão > 10%)".
#
# ## How the 10% rule is enforced (Issue #629, ADR 038)
#
# Two measurements of the same benches, with different jobs:
#
#   * **wall-clock (ns/iter)** — published to `gh-pages` by
#     `github-action-benchmark` for the trend graph. **Advisory only**
#     (`fail-on-alert: false`). It cannot gate: `ubuntu-latest` mixes CPU
#     classes and this bench, unchanged, has measured from 1 736 to 17 370 ns
#     per iteration across 191 stored runs. Three consecutive runs of identical
#     code gave calib 43 164 / 68 506 / 42 310 ns while the target itself stayed
#     within 2.3% — the machine moves, not the code.
#
#   * **instructions retired (callgrind)** — the gate. Deterministic: three
#     rebuilds of the same source give the same count to the instruction
#     (45 552 for `parse_method_ids_20k`, three times, zero variance). The 10%
#     threshold from §3.2 is applied to the **instruction delta** over a `noop`
#     run, so it fires on code changes and never on the runner fleet.
#
# The baseline lives in `crates/rd-dex/benches/ir-baseline.json` and is reviewed
# with the code: when a change legitimately alters the work, the PR updates it
# (`python3 scripts/bench_ir.py --results ir.txt --write`) and the diff is part
# of the review.
#
# Only push-to-main gates. Manual runs measure and report only.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-main
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: benches (rd-dex parse tables)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # write só para o job: github-action-benchmark grava o histórico no gh-pages
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # valgrind ships in the runner image; the install is a no-op guard for the
      # day it does not.
      - name: Ensure valgrind
        run: |
          set -euo pipefail
          command -v valgrind || sudo apt-get install -y valgrind
          valgrind --version

      # ── wall clock: advisory history ──────────────────────────────────────
      - name: Run benches (wall clock, advisory)
        run: |-
          set -euo pipefail
          cargo bench -p rd-dex --bench parse_tables --locked | tee bench-output.txt
          grep -q '^test ' bench-output.txt || { echo "::error::no bench results"; exit 1; }

      # ── instructions retired: the gate ────────────────────────────────────
      - name: Count instructions (callgrind)
        run: |-
          set -euo pipefail
          cargo bench -p rd-dex --bench parse_tables --no-run --locked
          bin="$(ls -t target/release/deps/parse_tables-* | grep -v '\.d$' | head -1)"
          test -x "$bin" || { echo "::error::bench binary not found"; exit 1; }
          echo "bench binary: ${bin}"
          : > ir.txt
          for target in noop parse_method_ids_20k parse_field_ids_20k; do
            out="${RUNNER_TEMP}/callgrind.${target}"
            valgrind --tool=callgrind --callgrind-out-file="$out" -q "$bin" --count "$target"
            total="$(callgrind_annotate "$out" | sed -n 's/^\([0-9,]*\) .*/\1/p' | head -1 | tr -d ,)"
            test -n "$total" || { echo "::error::no instruction total for ${target}"; exit 1; }
            echo "ir ${target} ${total}" >> ir.txt
          done
          cat ir.txt

      - name: Gate on regression (§3.2, 10% of instructions)
        if: github.event_name == 'push'
        run: |-
          set -euo pipefail
          python3 scripts/bench_ir.py --results ir.txt --threshold 0.10 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # History writer only. Its own alert stays advisory: it compares against the
      # single previous run on a different machine, which is the #629 flaw.
      - name: Store wall-clock history (advisory alert only)
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: rd-dex parse tables
          tool: cargo
          output-file-path: bench-output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          alert-threshold: "110%"
          comment-on-alert: false
          fail-on-alert: false
