name: Docs site (mdBook)

# Publishes docs/ as a static mdBook site on GitHub Pages (M12).
#
# ## Why it deploys to `gh-pages` instead of using `deploy-pages`
#
# Pages for this repository is already enabled in **legacy** mode with
# `source = gh-pages:/` (`GET /repos/:owner/:repo/pages` reports
# `build_type: legacy`). That is normally a handicap, but here it is the
# pragmatic path: publishing is a plain branch push, so the workflow needs only
# `contents: write` and no maintainer has to flip a repository setting for the
# site to come alive.
#
# The previous revision gated everything behind `vars.PAGES_ENABLED == 'true'`
# and produced nothing while that variable was unset — the site 404'd at the
# root for months. This revision always builds and, on `main`, always publishes.
#
# `gh-pages` is shared: `bench.yml` keeps its history at `dev/bench/` there, so
# the deploy preserves everything except the site payload and takes only the
# root. A push race with the bench job is handled by retrying the whole
# fetch → merge → push cycle.
#
# ## Security notes (formerly RD Sentinel `_workflow_findings`; RD Sentinel retired, ADR 010)
# The deploy job requests `contents: write`, so every action is pinned to a full
# commit SHA. No `${{ }}` expression appears inside a `run:` script; values
# arrive through `env:`. The token is never written to a remote URL — it goes
# into a per-repository `http.extraheader`, which git does not echo.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/gen_adr_index.py"
      - ".github/workflows/docs.yml"
  # Atualiza a matriz "viva" mesmo em dias sem commit: o nightly roda às 04:43
  # UTC e este build busca o artefato da última run bem-sucedida.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build book
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `actions: read` só para ler a última run do nightly-compat e baixar o
    # artefato dela (a página docs/compat-live.md). Nada de escrita.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The ADR index is generated from docs/adr/*.md; a stale copy means the
      # published book silently omits decisions. Same gate shape as the
      # generated compatibility scoreboard.
      - name: ADR index is in sync with docs/adr/
        run: python3 scripts/gen_adr_index.py

      # M12: a matriz "viva" (docs/compat-live.md + docs/compat-badge.svg) é
      # renderizada a partir do artefato da última run **bem-sucedida** do
      # nightly-compat. Best-effort de propósito: sem run, com artefato expirado
      # (retenção de 14 dias) ou sem permissão, a página publica o estado
      # "sem dados" e o site continua de pé — um placar ausente não pode
      # derrubar a documentação.
      - name: Coletar a evidência da última rodada noturna
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          api="https://api.github.com/repos/${REPO}"
          hdr=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")
          empty() { echo "::notice::$1"; echo '{}' > reports-run.json; exit 0; }

          runs="$(curl -fsSL "${hdr[@]}" "${api}/actions/workflows/nightly-compat.yml/runs?status=success&per_page=1" 2>/dev/null)" \
            || empty "sem acesso às runs do nightly; publicando o estado 'sem dados'"
          run_id="$(printf '%s' "$runs" | python3 -c 'import json,sys
          r = json.load(sys.stdin).get("workflow_runs") or []
          print(r[0]["id"] if r else "")')"
          [ -n "$run_id" ] || empty "nenhuma run noturna bem-sucedida ainda; publicando o estado 'sem dados'"

          curl -fsSL "${hdr[@]}" "${api}/actions/runs/${run_id}" -o reports-run.json 2>/dev/null \
            || empty "não consegui ler a run ${run_id}; publicando o estado 'sem dados'"

          arts="$(curl -fsSL "${hdr[@]}" "${api}/actions/runs/${run_id}/artifacts" 2>/dev/null)"
          url="$(printf '%s' "$arts" | python3 -c 'import json,sys
          a = json.load(sys.stdin).get("artifacts") or []
          print(next((x["archive_download_url"] for x in a if x["name"] == "nightly-compat-reports"), ""))')"
          [ -n "$url" ] || empty "a run ${run_id} não tem o artefato nightly-compat-reports (expirado?)"

          # O zip do upload-artifact guarda os caminhos relativos a `reports/`;
          # dependendo do upload o diretório pode vir no topo. Aceita os dois.
          mkdir -p reports-dl
          if curl -fsSL "${hdr[@]}" -o compat.zip "$url" && unzip -q compat.zip -d reports-dl; then
            if [ -d reports-dl/junit ]; then
              mkdir -p reports && cp -R reports-dl/. reports/
            elif [ -d reports-dl/reports/junit ]; then
              mkdir -p reports && cp -R reports-dl/reports/. reports/
            else
              echo "::warning::o artefato veio sem junit/; a página fica sem tabela por suíte"
            fi
          else
            echo "::warning::download do artefato falhou; a página fica sem tabela por suíte"
          fi
          rm -rf reports-dl compat.zip

      - name: Renderizar a matriz viva
        run: |
          set -euo pipefail
          python3 scripts/compat_live.py --reports reports --run-json reports-run.json
          grep -q "compat-live:begin" docs/compat-live.md

      - name: Self-tests do renderizador
        run: bash tests/scripts/compat_live_test.sh

      # Mesma ideia da matriz viva, política de falha diferente: a lista de
      # releases não envelhece, então se a API não responder o script sai sem
      # tocar na página e o build publica o último snapshot versionado.
      - name: Renderizar a página de releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_RELEASES: https://api.github.com/repos/${{ github.repository }}/releases?per_page=30
        run: |
          set -uo pipefail
          if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
               -H "Accept: application/vnd.github+json" \
               "${API_RELEASES}" -o releases.json 2>/dev/null; then
            python3 scripts/releases_live.py --api-json releases.json
          else
            echo "::notice::API de releases indisponível; mantendo o snapshot versionado"
          fi

      - name: Self-tests da página de releases
        run: bash tests/scripts/releases_live_test.sh

      - name: Install mdBook (pinned)
        run: cargo install mdbook --locked --version 0.5.4

      - name: Build
        run: mdbook build docs

      - name: Fail if the book produced no index
        run: test -f target/mdbook/index.html

      # The ADR index must exist as a page, not just as a file on disk.
      - name: Header exists in the published ADR index
        # mdBook renders `adr/README.md` as `adr/index.html`, not `adr/README.html`.
        run: grep -q "Índice de Architecture Decision Records" target/mdbook/adr/index.html

      # `scripts/check_md_links.py` validates the **repository** view, where
      # `docs/adr/../README.md` is a real file. The **book** view differs: mdBook
      # only renders what lives under `docs/`, so the same link resolves to a
      # page that does not exist. Rewrite those to the GitHub blob URL, then
      # assert nothing is left missing. Note that `../css/*` and `../favicon-*`
      # are mdBook's own assets for subdirectory pages and must be left alone —
      # the script checks the target's existence rather than pattern-matching.
      - name: Links that escape the book root point at GitHub
        run: python3 scripts/book_links.py --site target/mdbook

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mdbook-site
          path: target/mdbook

  deploy:
    name: deploy to gh-pages
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # No `environment:` here on purpose. The repository's `github-pages`
    # environment carries a deployment branch policy that allows only
    # `gh-pages` (custom_branch_policies, get
    # `/environments/github-pages/deployment-branch-policies` -> ["gh-pages"]).
    # A job on `main` that declares that environment is rejected by GitHub
    # *before* any step runs: the run shows `failure` with zero steps and no
    # log, which is exactly how the first deployment after #631 died.
    # This job publishes by pushing to `gh-pages`, so it never needs the
    # environment — only the branch push.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mdbook-site
          path: site

      - name: Publish to gh-pages (preserving dev/bench)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SITE: ${{ github.workspace }}/site
        run: |-
          set -euo pipefail
          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"

          publish() {
            work="$(mktemp -d)"
            cd "$work"
            git init -q .
            git remote add origin "https://github.com/${REPO}.git"
            git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"
            git fetch --depth=1 origin gh-pages
            git checkout -q -B gh-pages FETCH_HEAD

            # Keep everything except the site payload (notably dev/bench/).
            git rm -rq --cached . || true
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name dev -exec rm -rf {} +

            cp -R "${SITE}/." .
            rm -rf dev/bench/.git 2>/dev/null || true
            touch .nojekyll

            git add -A
            if git diff --cached --quiet; then
              echo "::notice::gh-pages already up to date"
              return 0
            fi
            git commit -q -m "docs: publish mdBook site for ${SHA:0:7}"
            git push -q origin gh-pages
          }

          for attempt in 1 2 3; do
            if publish; then
              echo "::notice::published gh-pages on attempt ${attempt}"
              {
                echo "### Docs site published"
                echo
                echo "<https://nadabgfccvd.github.io/RustyDroid/>"
                echo
                echo "Commit: ${SHA}"
              } >>"${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
            echo "::warning::gh-pages publish attempt ${attempt} lost a race; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::could not publish gh-pages after 3 attempts"
          exit 1
